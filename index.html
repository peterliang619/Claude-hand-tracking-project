<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hand</title>
    <style>
        /* ==========================================
           FROSTED GLASS LANDING PAGE
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Frosted glass overlay */
        #landing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
            z-index: 1000;
        }

        /* Fade out animation */
        #landing-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Title styling */
        h1 {
            font-size: 48px;
            font-weight: 200;
            letter-spacing: 8px;
            color: #ffffff;
            text-align: center;
            user-select: none;
        }

        /* Subtle hint text */
        .hint {
            position: absolute;
            bottom: 60px;
            font-size: 0.7em;
            color: #666;
            letter-spacing: 3px;
            text-transform: lowercase;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div id="landing-overlay">
        <h1>Echo Hand.</h1>
        <div class="hint">click to enter</div>
    </div>

    <script>
        // ==========================================
        // LANDING PAGE INTERACTION
        // ==========================================
        const overlay = document.getElementById('landing-overlay');

        // Click anywhere to enter
        overlay.addEventListener('click', () => {
            // Add fade-out class
            overlay.classList.add('fade-out');

            // Navigate to level selection after fade completes
            setTimeout(() => {
                window.location.href = 'levels.html';
            }, 1000); // 1 second to match transition
        });

        // Optional: Add subtle animation on load
        window.addEventListener('load', () => {
            overlay.style.opacity = '1';
        });
    </script>
</body>
</html>
