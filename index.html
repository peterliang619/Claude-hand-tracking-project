<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Hand</title>
    <style>
        /* ==========================================
           FROSTED GLASS LANDING PAGE
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none;
        }

        /* Frosted glass overlay */
        #landing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 1000;
        }

        /* Fade in animation */
        #landing-overlay.fade-in {
            opacity: 1;
        }

        /* Fade out animation */
        #landing-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Title styling */
        h1 {
            font-size: 48px;
            font-weight: 200;
            letter-spacing: 8px;
            color: #ffffff;
            text-align: center;
            user-select: none;
        }

        /* Subtle hint text */
        .hint {
            position: absolute;
            bottom: 60px;
            font-size: 0.7em;
            color: #666;
            letter-spacing: 3px;
            text-transform: lowercase;
            font-weight: 300;
        }

        /* Custom cursor */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-circle {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.2s ease;
            transform: translate(-50%, -50%);
        }

        #landing-overlay:hover ~ .cursor-dot {
            transform: translate(-50%, -50%) scale(1.5);
        }

        #landing-overlay:hover ~ .cursor-circle {
            transform: translate(-50%, -50%) scale(1.5);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Custom cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>

    <div id="landing-overlay">
        <h1>Echo Hand.</h1>
        <div class="hint">click to enter</div>
    </div>

    <script>
        // ==========================================
        // LANDING PAGE INTERACTION
        // ==========================================
        const overlay = document.getElementById('landing-overlay');

        // Click anywhere to enter
        overlay.addEventListener('click', () => {
            // Add fade-out class
            overlay.classList.add('fade-out');

            // Navigate to level selection after fade completes
            setTimeout(() => {
                window.location.href = 'levels.html';
            }, 1000); // 1 second to match transition
        });

        // Fade in immediately when script runs
        overlay.classList.add('fade-in');

        // ==========================================
        // CUSTOM CURSOR TRACKING
        // ==========================================
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');

        let mouseX = 0;
        let mouseY = 0;
        let circleX = 0;
        let circleY = 0;

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Update dot position immediately
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        // Smooth follow for circle
        function animateCursor() {
            // Lerp (linear interpolation) for smooth following
            circleX += (mouseX - circleX) * 0.15;
            circleY += (mouseY - circleY) * 0.15;

            cursorCircle.style.left = circleX + 'px';
            cursorCircle.style.top = circleY + 'px';

            requestAnimationFrame(animateCursor);
        }

        animateCursor();
    </script>
</body>
</html>
