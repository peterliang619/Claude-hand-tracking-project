<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Recognition - Select Level</title>
    <style>
        /* ==========================================
           MINIMALIST LEVEL SELECTION
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            cursor: none;
        }

        /* Fade in animation */
        body.fade-in {
            opacity: 1;
        }

        /* Fade out animation */
        body.fade-out {
            opacity: 0;
        }

        h1 {
            font-size: 0.75em;
            margin-bottom: 100px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
        }

        .level-container {
            display: flex;
            gap: 60px;
            align-items: center;
        }

        .level-button {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 3em;
            font-weight: 200;
            padding: 40px 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .level-button:hover {
            border-color: #666;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .level-button:active {
            border-color: #999;
            color: #ffffff;
        }

        .level-label {
            font-size: 0.65em;
            margin-top: 20px;
            text-align: center;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        @media (max-width: 768px) {
            .level-container {
                flex-direction: column;
                gap: 40px;
            }

            .level-button {
                font-size: 2.5em;
                padding: 30px 50px;
            }
        }

        /* Custom cursor */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-circle {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.2s ease;
            transform: translate(-50%, -50%);
        }

        .level-button:hover ~ .cursor-dot,
        h1:hover ~ .cursor-dot {
            transform: translate(-50%, -50%) scale(1.5);
        }

        .level-button:hover ~ .cursor-circle,
        h1:hover ~ .cursor-circle {
            transform: translate(-50%, -50%) scale(1.5);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Custom cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>

    <h1>START YOUR SIGN LANGUAGE LEARNING</h1>

    <div class="level-container">
        <div>
            <button class="level-button" onclick="selectLevel(1)">1</button>
            <div class="level-label">beginner</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(2)">2</button>
            <div class="level-label">intermediate</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(3)">3</button>
            <div class="level-label">advanced</div>
        </div>
    </div>

    <script>
        // ==========================================
        // PAGE TRANSITION
        // ==========================================
        // Fade in immediately when script runs
        document.body.classList.add('fade-in');

        function selectLevel(level) {
            // Store selected level in localStorage
            localStorage.setItem('aslLevel', level);

            // Fade out before navigation
            document.body.classList.add('fade-out');

            // Navigate to the ASL recognition page after fade
            setTimeout(() => {
                window.location.href = 'asl-recognition.html';
            }, 800);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') selectLevel(1);
            if (e.key === '2') selectLevel(2);
            if (e.key === '3') selectLevel(3);
        });

        // ==========================================
        // CUSTOM CURSOR TRACKING
        // ==========================================
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');

        let mouseX = 0;
        let mouseY = 0;
        let circleX = 0;
        let circleY = 0;

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Update dot position immediately
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        // Smooth follow for circle
        function animateCursor() {
            // Lerp (linear interpolation) for smooth following
            circleX += (mouseX - circleX) * 0.15;
            circleY += (mouseY - circleY) * 0.15;

            cursorCircle.style.left = circleX + 'px';
            cursorCircle.style.top = circleY + 'px';

            requestAnimationFrame(animateCursor);
        }

        animateCursor();
    </script>
</body>
</html>
