<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Recognition - Select Level</title>
    <style>
        /* ==========================================
           WABI-SABI LEVEL SELECTION
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #f5f0eb 0%, #e8dfd6 100%);
            color: #8b7e74;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.2s ease;
            cursor: none;
        }

        /* Fade in animation */
        body.fade-in {
            opacity: 1;
        }

        /* Fade out animation */
        body.fade-out {
            opacity: 0;
        }

        h1 {
            font-size: 0.65em;
            margin-bottom: 60px;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: lowercase;
            color: #bfb3a8;
        }

        /* Webcam container */
        #webcam-container {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 240px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(191, 179, 168, 0.2);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        #gesture-hint {
            position: absolute;
            top: 230px;
            right: 40px;
            width: 240px;
            text-align: center;
            font-size: 0.55em;
            color: #c4b5a8;
            letter-spacing: 2px;
            font-weight: 300;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .level-container {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .level-button {
            background: transparent;
            border: 1px solid rgba(191, 179, 168, 0.3);
            color: #bfb3a8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 2.5em;
            font-weight: 200;
            padding: 35px 55px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 2px;
            border-radius: 20px;
        }

        .level-button:hover {
            border-color: rgba(139, 126, 116, 0.5);
            color: #8b7e74;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .level-button:active {
            border-color: rgba(139, 126, 116, 0.7);
            color: #8b7e74;
        }

        .level-label {
            font-size: 0.6em;
            margin-top: 18px;
            text-align: center;
            color: #d4c9be;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: lowercase;
        }

        @media (max-width: 768px) {
            .level-container {
                flex-direction: column;
                gap: 35px;
            }

            .level-button {
                font-size: 2em;
                padding: 28px 45px;
            }

            #webcam-container {
                width: 180px;
                height: 135px;
            }

            #gesture-hint {
                width: 180px;
                top: 185px;
            }
        }

        /* Custom cursor */
        .cursor-dot {
            width: 6px;
            height: 6px;
            background-color: #c4b5a8;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.2s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-circle {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(139, 126, 116, 0.2);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.25s ease;
            transform: translate(-50%, -50%);
        }

        .level-button:hover ~ .cursor-dot,
        h1:hover ~ .cursor-dot {
            transform: translate(-50%, -50%) scale(1.3);
        }

        .level-button:hover ~ .cursor-circle,
        h1:hover ~ .cursor-circle {
            transform: translate(-50%, -50%) scale(1.3);
            border-color: rgba(139, 126, 116, 0.35);
        }
    </style>
</head>
<body>
    <!-- Custom cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>

    <!-- Webcam for gesture control -->
    <div id="webcam-container"></div>
    <div id="gesture-hint">show 1, 2, or 3 fingers to select</div>

    <h1>choose your path</h1>

    <div class="level-container">
        <div>
            <button class="level-button" onclick="selectLevel(1)">1</button>
            <div class="level-label">begin</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(2)">2</button>
            <div class="level-label">explore</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(3)">3</button>
            <div class="level-label">connect</div>
        </div>
    </div>

    <!-- Load p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

    <!-- Load ml5.js library -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
        // ==========================================
        // PAGE TRANSITION
        // ==========================================
        // Fade in immediately when script runs
        document.body.classList.add('fade-in');

        function selectLevel(level) {
            // Store selected level in localStorage
            localStorage.setItem('aslLevel', level);

            // Fade out before navigation
            document.body.classList.add('fade-out');

            // Navigate to the ASL recognition page after fade
            setTimeout(() => {
                window.location.href = 'asl-recognition.html';
            }, 1200);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') selectLevel(1);
            if (e.key === '2') selectLevel(2);
            if (e.key === '3') selectLevel(3);
        });

        // ==========================================
        // GESTURE-BASED LEVEL SELECTION
        // ==========================================
        let video;
        let handpose;
        let predictions = [];
        let gestureTimeout = null;

        function setup() {
            // Create canvas for webcam
            let canvas = createCanvas(240, 180);
            canvas.parent('webcam-container');

            // Initialize webcam capture
            video = createCapture(VIDEO);
            video.size(240, 180);
            video.hide();

            // Load the Handpose model for hand tracking
            handpose = ml5.handpose(video, () => {
                console.log('Handpose model loaded!');
            });

            // Listen for hand predictions
            handpose.on('predict', (results) => {
                predictions = results;
                detectFingerGesture();
            });
        }

        function draw() {
            // Draw the mirrored webcam feed
            push();
            translate(width, 0);
            scale(-1, 1);
            image(video, 0, 0, width, height);
            pop();

            // Draw hand landmarks if detected
            if (predictions.length > 0) {
                for (let i = 0; i < predictions.length; i++) {
                    const hand = predictions[i];
                    const landmarks = hand.landmarks;

                    // Scale and mirror the landmarks
                    const scaledLandmarks = landmarks.map(point => [
                        width - point[0],
                        point[1],
                        point[2]
                    ]);

                    // Draw simple dots for landmarks
                    fill(168, 154, 142, 150);
                    noStroke();
                    for (let j = 0; j < scaledLandmarks.length; j++) {
                        const [x, y] = scaledLandmarks[j];
                        circle(x, y, 4);
                    }
                }
            }
        }

        // ==========================================
        // FINGER COUNTING LOGIC
        // ==========================================
        function detectFingerGesture() {
            if (predictions.length === 0) return;

            const hand = predictions[0];
            const landmarks = hand.landmarks;

            // Count extended fingers
            let fingersUp = 0;

            // Thumb (check if tip is to the right/left of knuckle)
            const thumbTip = landmarks[4];
            const thumbKnuckle = landmarks[3];
            if (Math.abs(thumbTip[0] - thumbKnuckle[0]) > 30) {
                fingersUp++;
            }

            // Other fingers (check if tip is above knuckle)
            const fingerTips = [8, 12, 16, 20]; // Index, middle, ring, pinky
            const fingerKnuckles = [6, 10, 14, 18];

            for (let i = 0; i < fingerTips.length; i++) {
                const tip = landmarks[fingerTips[i]];
                const knuckle = landmarks[fingerKnuckles[i]];

                // If tip is significantly above knuckle, finger is extended
                if (tip[1] < knuckle[1] - 20) {
                    fingersUp++;
                }
            }

            // Trigger level selection based on finger count
            if (fingersUp >= 1 && fingersUp <= 3) {
                // Debounce gesture detection
                if (gestureTimeout === null) {
                    gestureTimeout = setTimeout(() => {
                        selectLevel(fingersUp);
                        gestureTimeout = null;
                    }, 1500); // Wait 1.5 seconds before triggering
                }
            } else {
                // Reset timeout if gesture changes
                if (gestureTimeout !== null) {
                    clearTimeout(gestureTimeout);
                    gestureTimeout = null;
                }
            }
        }

        // ==========================================
        // CUSTOM CURSOR TRACKING
        // ==========================================
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');

        let mouseX = 0;
        let mouseY = 0;
        let circleX = 0;
        let circleY = 0;

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Update dot position immediately
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        // Smooth follow for circle
        function animateCursor() {
            // Lerp (linear interpolation) for smooth following
            circleX += (mouseX - circleX) * 0.15;
            circleY += (mouseY - circleY) * 0.15;

            cursorCircle.style.left = circleX + 'px';
            cursorCircle.style.top = circleY + 'px';

            requestAnimationFrame(animateCursor);
        }

        animateCursor();
    </script>
</body>
</html>
