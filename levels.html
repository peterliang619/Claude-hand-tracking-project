<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Recognition - Select Level</title>
    <style>
        /* ==========================================
           MINIMALIST LEVEL SELECTION
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 0.75em;
            margin-bottom: 100px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
        }

        .level-container {
            display: flex;
            gap: 60px;
            align-items: center;
        }

        .level-button {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 3em;
            font-weight: 200;
            padding: 40px 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .level-button:hover {
            border-color: #666;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .level-button:active {
            border-color: #999;
            color: #ffffff;
        }

        .level-label {
            font-size: 0.65em;
            margin-top: 20px;
            text-align: center;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        @media (max-width: 768px) {
            .level-container {
                flex-direction: column;
                gap: 40px;
            }

            .level-button {
                font-size: 2.5em;
                padding: 30px 50px;
            }
        }
    </style>
</head>
<body>
    <h1>ASL RECOGNITION</h1>

    <div class="level-container">
        <div>
            <button class="level-button" onclick="selectLevel(1)">1</button>
            <div class="level-label">beginner</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(2)">2</button>
            <div class="level-label">intermediate</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(3)">3</button>
            <div class="level-label">advanced</div>
        </div>
    </div>

    <script>
        function selectLevel(level) {
            // Store selected level in localStorage
            localStorage.setItem('aslLevel', level);

            // Navigate to the ASL recognition page
            window.location.href = 'asl-recognition.html';
        }

        // Optional: Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') selectLevel(1);
            if (e.key === '2') selectLevel(2);
            if (e.key === '3') selectLevel(3);
        });
    </script>
</body>
</html>
