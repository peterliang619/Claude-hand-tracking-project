<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Recognition - Select Level</title>
    <style>
        /* ==========================================
           WABI-SABI LEVEL SELECTION
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #f5f0eb 0%, #e8dfd6 100%);
            color: #8b7e74;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.2s ease;
            cursor: none;
        }

        /* Fade in animation */
        body.fade-in {
            opacity: 1;
        }

        /* Fade out animation */
        body.fade-out {
            opacity: 0;
        }

        h1 {
            font-size: 0.75em;
            margin-bottom: 60px;
            font-weight: 600;
            letter-spacing: 6px;
            text-transform: lowercase;
            color: #5a4d44;
        }

        /* Webcam container */
        #webcam-container {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 240px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(191, 179, 168, 0.2);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        #gesture-hint {
            position: absolute;
            top: 230px;
            right: 40px;
            width: 240px;
            text-align: center;
            font-size: 0.6em;
            color: #8b7e74;
            letter-spacing: 2px;
            font-weight: 400;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .level-container {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .level-button {
            background: transparent;
            border: 2px solid rgba(139, 126, 116, 0.4);
            color: #7a6d64;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 2.5em;
            font-weight: 300;
            padding: 35px 55px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 2px;
            border-radius: 20px;
        }

        .level-button:hover {
            border-color: rgba(90, 77, 68, 0.6);
            color: #5a4d44;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .level-button:active {
            border-color: rgba(90, 77, 68, 0.8);
            color: #5a4d44;
        }

        .level-label {
            font-size: 0.65em;
            margin-top: 18px;
            text-align: center;
            color: #8b7e74;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: lowercase;
        }

        @media (max-width: 768px) {
            .level-container {
                flex-direction: column;
                gap: 35px;
            }

            .level-button {
                font-size: 2em;
                padding: 28px 45px;
            }

            #webcam-container {
                width: 180px;
                height: 135px;
            }

            #gesture-hint {
                width: 180px;
                top: 185px;
            }
        }

        /* Custom cursor */
        .cursor-dot {
            width: 6px;
            height: 6px;
            background-color: #c4b5a8;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.2s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-circle {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(139, 126, 116, 0.2);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.25s ease;
            transform: translate(-50%, -50%);
        }

        .level-button:hover ~ .cursor-dot,
        h1:hover ~ .cursor-dot {
            transform: translate(-50%, -50%) scale(1.3);
        }

        .level-button:hover ~ .cursor-circle,
        h1:hover ~ .cursor-circle {
            transform: translate(-50%, -50%) scale(1.3);
            border-color: rgba(139, 126, 116, 0.35);
        }

        /* Helper mascot */
        #helper-mascot {
            position: absolute;
            top: 40px;
            left: -300px;
            display: flex;
            align-items: center;
            gap: 20px;
            animation: slideInFromLeft 1s ease-out 0.5s forwards;
            opacity: 0;
        }

        @keyframes slideInFromLeft {
            to {
                left: 40px;
                opacity: 1;
            }
        }

        #helper-hand {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        #helper-text {
            background: rgba(255, 255, 255, 0.9);
            color: #8b7e74;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 0.7em;
            letter-spacing: 2px;
            font-weight: 400;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(139, 126, 116, 0.2);
            max-width: 280px;
            line-height: 1.6;
        }

        #helper-text span {
            opacity: 0;
            animation: typeChar 0.05s ease-in-out forwards;
        }

        @keyframes typeChar {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Custom cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>

    <!-- Helper mascot -->
    <div id="helper-mascot">
        <svg id="helper-hand" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Cartoony waving hand -->
            <!-- Palm -->
            <ellipse cx="50" cy="55" rx="18" ry="22" fill="#f4d4b8" opacity="0.95"/>
            <!-- Thumb -->
            <ellipse cx="32" cy="45" rx="8" ry="14" fill="#f4d4b8" opacity="0.95" transform="rotate(-25 32 45)"/>
            <!-- Index finger -->
            <rect x="38" y="20" width="8" height="25" rx="4" fill="#f4d4b8" opacity="0.95"/>
            <!-- Middle finger -->
            <rect x="46" y="18" width="8" height="27" rx="4" fill="#f4d4b8" opacity="0.95"/>
            <!-- Ring finger -->
            <rect x="54" y="22" width="7" height="23" rx="3.5" fill="#f4d4b8" opacity="0.95"/>
            <!-- Pinky -->
            <rect x="62" y="28" width="6" height="18" rx="3" fill="#f4d4b8" opacity="0.95"/>
            <!-- Wrist/Base -->
            <rect x="38" y="70" width="24" height="15" rx="4" fill="#f4d4b8" opacity="0.95"/>
            <!-- Finger details -->
            <line x1="40" y1="35" x2="44" y2="35" stroke="#e8c4a8" stroke-width="1" opacity="0.5"/>
            <line x1="48" y1="33" x2="52" y2="33" stroke="#e8c4a8" stroke-width="1" opacity="0.5"/>
            <line x1="56" y1="37" x2="59" y2="37" stroke="#e8c4a8" stroke-width="1" opacity="0.5"/>
        </svg>
        <div id="helper-text"></div>
    </div>

    <!-- Webcam for gesture control -->
    <div id="webcam-container"></div>
    <div id="gesture-hint">show 1, 2, or 3 fingers to select</div>

    <h1>choose your level</h1>

    <div class="level-container">
        <div>
            <button class="level-button" onclick="selectLevel(1)">1</button>
            <div class="level-label">beginner</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(2)">2</button>
            <div class="level-label">intermediate</div>
        </div>

        <div>
            <button class="level-button" onclick="selectLevel(3)">3</button>
            <div class="level-label">advanced</div>
        </div>
    </div>

    <!-- Load p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

    <!-- Load ml5.js library -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
        // ==========================================
        // PAGE TRANSITION
        // ==========================================
        // Fade in immediately when script runs
        document.body.classList.add('fade-in');

        // ==========================================
        // HELPER TEXT TYPING ANIMATION
        // ==========================================
        const helperMessage = "You can click or sign to choose the level you want";
        const helperTextElement = document.getElementById('helper-text');

        function typeHelperText() {
            const chars = helperMessage.split('');
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.style.animationDelay = `${1.5 + index * 0.05}s`;
                helperTextElement.appendChild(span);
            });
        }

        typeHelperText();

        function selectLevel(level) {
            // Store selected level in localStorage
            localStorage.setItem('aslLevel', level);

            // Fade out before navigation
            document.body.classList.add('fade-out');

            // Navigate to the learning page after fade
            setTimeout(() => {
                window.location.href = 'learning.html';
            }, 1200);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') selectLevel(1);
            if (e.key === '2') selectLevel(2);
            if (e.key === '3') selectLevel(3);
        });

        // ==========================================
        // GESTURE-BASED LEVEL SELECTION
        // ==========================================
        let video;
        let handpose;
        let predictions = [];
        let gestureTimeout = null;

        function setup() {
            // Create canvas for webcam
            let canvas = createCanvas(240, 180);
            canvas.parent('webcam-container');

            // Initialize webcam capture
            video = createCapture(VIDEO);
            video.size(240, 180);
            video.hide();

            // Load the Handpose model for hand tracking
            handpose = ml5.handpose(video, () => {
                console.log('Handpose model loaded!');
            });

            // Listen for hand predictions
            handpose.on('predict', (results) => {
                predictions = results;
                detectFingerGesture();
            });
        }

        function draw() {
            // Draw the mirrored webcam feed
            push();
            translate(width, 0);
            scale(-1, 1);
            image(video, 0, 0, width, height);
            pop();

            // Draw hand landmarks if detected
            if (predictions.length > 0) {
                for (let i = 0; i < predictions.length; i++) {
                    const hand = predictions[i];
                    const landmarks = hand.landmarks;

                    // Calculate scale factors from video to canvas
                    const scaleX = width / video.width;
                    const scaleY = height / video.height;

                    // Scale and mirror the landmarks to match canvas
                    const scaledLandmarks = landmarks.map(point => [
                        width - (point[0] * scaleX),
                        point[1] * scaleY,
                        point[2]
                    ]);

                    // Draw connections (skeleton)
                    stroke(255, 255, 255, 200);
                    strokeWeight(2);
                    noFill();

                    const connections = [
                        [0, 1, 2, 3, 4],      // Thumb
                        [0, 5, 6, 7, 8],      // Index finger
                        [0, 9, 10, 11, 12],   // Middle finger
                        [0, 13, 14, 15, 16],  // Ring finger
                        [0, 17, 18, 19, 20],  // Pinky
                        [5, 9, 13, 17]        // Palm
                    ];

                    for (let path of connections) {
                        beginShape();
                        for (let index of path) {
                            const [x, y] = scaledLandmarks[index];
                            vertex(x, y);
                        }
                        endShape();
                    }

                    // Draw landmark dots
                    fill(255, 255, 255, 220);
                    noStroke();
                    for (let j = 0; j < scaledLandmarks.length; j++) {
                        const [x, y] = scaledLandmarks[j];
                        circle(x, y, 4);
                    }
                }
            }
        }

        // ==========================================
        // FINGER COUNTING LOGIC
        // ==========================================
        function detectFingerGesture() {
            if (predictions.length === 0) return;

            const hand = predictions[0];
            const landmarks = hand.landmarks;

            // Count extended fingers
            let fingersUp = 0;

            // Thumb (check if tip is to the right/left of knuckle)
            const thumbTip = landmarks[4];
            const thumbKnuckle = landmarks[3];
            if (Math.abs(thumbTip[0] - thumbKnuckle[0]) > 30) {
                fingersUp++;
            }

            // Other fingers (check if tip is above knuckle)
            const fingerTips = [8, 12, 16, 20]; // Index, middle, ring, pinky
            const fingerKnuckles = [6, 10, 14, 18];

            for (let i = 0; i < fingerTips.length; i++) {
                const tip = landmarks[fingerTips[i]];
                const knuckle = landmarks[fingerKnuckles[i]];

                // If tip is significantly above knuckle, finger is extended
                if (tip[1] < knuckle[1] - 20) {
                    fingersUp++;
                }
            }

            // Trigger level selection based on finger count
            if (fingersUp >= 1 && fingersUp <= 3) {
                // Debounce gesture detection
                if (gestureTimeout === null) {
                    gestureTimeout = setTimeout(() => {
                        selectLevel(fingersUp);
                        gestureTimeout = null;
                    }, 1500); // Wait 1.5 seconds before triggering
                }
            } else {
                // Reset timeout if gesture changes
                if (gestureTimeout !== null) {
                    clearTimeout(gestureTimeout);
                    gestureTimeout = null;
                }
            }
        }

        // ==========================================
        // CUSTOM CURSOR TRACKING
        // ==========================================
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');

        let mouseX = 0;
        let mouseY = 0;
        let circleX = 0;
        let circleY = 0;

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Update dot position immediately
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        // Smooth follow for circle
        function animateCursor() {
            // Lerp (linear interpolation) for smooth following
            circleX += (mouseX - circleX) * 0.15;
            circleY += (mouseY - circleY) * 0.15;

            cursorCircle.style.left = circleX + 'px';
            cursorCircle.style.top = circleY + 'px';

            requestAnimationFrame(animateCursor);
        }

        animateCursor();
    </script>
</body>
</html>
