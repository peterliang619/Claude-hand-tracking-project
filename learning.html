<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn ASL</title>
    <style>
        /* ==========================================
           WABI-SABI LEARNING PAGE
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #f5f0eb 0%, #e8dfd6 100%);
            color: #8b7e74;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            opacity: 0;
            transition: opacity 1.2s ease;
            cursor: none;
        }

        /* Fade in animation */
        body.fade-in {
            opacity: 1;
        }

        /* Fade out animation */
        body.fade-out {
            opacity: 0;
        }

        /* Main container */
        #main-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Top section - Current letter */
        #top-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 0.7em;
            margin: 0 0 30px 0;
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: lowercase;
            color: #6b5f56;
        }

        /* Back button */
        #back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            background: transparent;
            border: 1px solid rgba(191, 179, 168, 0.3);
            color: #bfb3a8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.65em;
            font-weight: 300;
            padding: 12px 24px;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: lowercase;
            transition: all 0.4s ease;
            border-radius: 20px;
        }

        #back-button:hover {
            border-color: rgba(139, 126, 116, 0.5);
            color: #8b7e74;
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Level indicator */
        #level-indicator {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 0.65em;
            color: #d4c9be;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: lowercase;
        }

        /* Skip button */
        #skip-button {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: transparent;
            border: 1px solid rgba(191, 179, 168, 0.3);
            color: #bfb3a8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.65em;
            font-weight: 300;
            padding: 12px 24px;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: lowercase;
            transition: all 0.4s ease;
            border-radius: 20px;
        }

        #skip-button:hover {
            border-color: rgba(139, 126, 116, 0.5);
            color: #8b7e74;
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Current letter display at top */
        #current-letter-display {
            text-align: center;
            margin-bottom: 20px;
        }

        #current-letter-label {
            font-size: 0.65em;
            color: #6b5f56;
            letter-spacing: 4px;
            font-weight: 400;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        #current-letter-big {
            font-size: 10em;
            font-weight: 200;
            color: #5a4d44;
            line-height: 1;
        }

        /* Middle section - Camera and word */
        #middle-section {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            padding: 0 60px;
        }

        /* Level 3 specific layout - camera at top-right */
        body.level-3 #middle-section {
            flex-direction: column;
            align-items: stretch;
            gap: 30px;
            padding: 0 60px;
            justify-content: flex-start;
        }

        body.level-3 #camera-wrapper {
            align-self: flex-end;
            width: 450px;
            height: 340px;
            flex: 0 0 auto;
        }

        body.level-3 #word-display {
            flex: 0 0 auto;
            order: 2;
            height: auto;
            max-height: 200px;
        }

        body.level-3 #top-section {
            margin-bottom: 20px;
        }

        body.level-3 #current-letter-big {
            font-size: 6em;
        }

        /* Curved camera container */
        #camera-wrapper {
            width: 600px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(139, 126, 116, 0.2);
        }

        /* Word display - horizontal */
        #word-display {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #word-letters {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
            flex-wrap: nowrap;
            margin: 0 auto;
        }

        /* Level 3 - smaller letters and images to fit */
        body.level-3 #word-letters {
            gap: 20px;
            align-items: center;
        }

        body.level-3 .word-letter {
            font-size: 1.5em;
        }

        body.level-3 .letter-image {
            width: 60px;
            height: 60px;
        }

        body.level-3 #instruction {
            margin-top: 10px;
            font-size: 0.6em;
        }

        .letter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: all 0.8s ease;
        }

        .word-letter {
            font-size: 3.5em;
            font-weight: 300;
            letter-spacing: 2px;
            color: #7a6d64;
            transition: all 0.8s ease;
        }

        /* Completed letters */
        .letter-container.completed .word-letter {
            opacity: 0.5;
            color: #b3a89f;
        }

        .letter-container.completed .letter-image {
            opacity: 0.5;
        }

        /* Current letter */
        .letter-container.current .word-letter {
            opacity: 1;
            color: #5a4d44;
            transform: scale(1.15);
            font-weight: 400;
        }

        .letter-container.current .letter-image {
            opacity: 1;
            transform: scale(1.1);
            border: 3px solid #8b7e74;
        }

        /* Upcoming letters */
        .letter-container.upcoming .word-letter {
            opacity: 0.3;
            color: #c9beb5;
        }

        .letter-container.upcoming .letter-image {
            opacity: 0.25;
        }

        .letter-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            transition: all 0.8s ease;
            border-radius: 16px;
            border: 2px solid rgba(139, 126, 116, 0.15);
            background-color: #f5f0eb;
            padding: 10px;
        }

        #instruction {
            font-size: 0.65em;
            color: #8b7e74;
            letter-spacing: 3px;
            font-weight: 400;
            margin-top: 20px;
        }

        #canvas-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        /* Completion overlay */
        #complete-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(245, 240, 235, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #complete-overlay.show {
            display: flex;
            opacity: 1;
        }

        #complete-content {
            text-align: center;
        }

        #complete-message {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 10px;
            color: #a89a8e;
            margin-bottom: 40px;
            text-transform: lowercase;
        }

        #complete-submessage {
            font-size: 0.9em;
            color: #c4b5a8;
            letter-spacing: 4px;
            font-weight: 300;
        }

        /* Custom cursor */
        .cursor-dot {
            width: 6px;
            height: 6px;
            background-color: #c4b5a8;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.2s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-circle {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(139, 126, 116, 0.2);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.25s ease;
            transform: translate(-50%, -50%);
        }

        #back-button:hover ~ .cursor-dot,
        button:hover ~ .cursor-dot {
            transform: translate(-50%, -50%) scale(1.3);
        }

        #back-button:hover ~ .cursor-circle,
        button:hover ~ .cursor-circle {
            transform: translate(-50%, -50%) scale(1.3);
            border-color: rgba(139, 126, 116, 0.35);
        }

        /* Mascot encouragement */
        #mascot-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
        }

        #mascot-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        #mascot {
            width: 80px;
            height: 80px;
        }

        #encouragement-text {
            background: rgba(255, 255, 255, 0.9);
            color: #8b7e74;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.9em;
            letter-spacing: 3px;
            font-weight: 400;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(139, 126, 116, 0.2);
        }
    </style>
</head>
<body>
    <!-- Custom cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>

    <!-- Back button -->
    <button id="back-button" onclick="goBack()">← levels</button>

    <!-- Level indicator -->
    <div id="level-indicator">level —</div>

    <!-- Skip button -->
    <button id="skip-button" onclick="skipLetter()">skip →</button>

    <!-- Mascot encouragement -->
    <div id="mascot-container">
        <svg id="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Cartoony hand giving thumbs up -->
            <!-- Palm -->
            <ellipse cx="50" cy="55" rx="18" ry="22" fill="#f4d4b8" opacity="0.95"/>
            <!-- Thumb -->
            <ellipse cx="32" cy="45" rx="8" ry="14" fill="#f4d4b8" opacity="0.95" transform="rotate(-25 32 45)"/>
            <!-- Index finger -->
            <rect x="43" y="20" width="8" height="25" rx="4" fill="#f4d4b8" opacity="0.95"/>
            <!-- Middle finger -->
            <rect x="52" y="18" width="8" height="27" rx="4" fill="#f4d4b8" opacity="0.95"/>
            <!-- Ring finger -->
            <rect x="61" y="22" width="7" height="23" rx="3.5" fill="#f4d4b8" opacity="0.95"/>
            <!-- Pinky -->
            <rect x="69" y="28" width="6" height="18" rx="3" fill="#f4d4b8" opacity="0.95"/>
            <!-- Wrist/Base -->
            <rect x="38" y="70" width="24" height="15" rx="4" fill="#f4d4b8" opacity="0.95"/>
            <!-- Finger details (knuckles) -->
            <line x1="45" y1="35" x2="49" y2="35" stroke="#e8c4a8" stroke-width="1" opacity="0.5"/>
            <line x1="54" y1="33" x2="58" y2="33" stroke="#e8c4a8" stroke-width="1" opacity="0.5"/>
            <line x1="63" y1="37" x2="66" y2="37" stroke="#e8c4a8" stroke-width="1" opacity="0.5"/>
        </svg>
        <div id="encouragement-text">great!</div>
    </div>

    <!-- Main container -->
    <div id="main-container">
        <!-- Top section - Current letter -->
        <div id="top-section">
            <h2>learn to sign</h2>
            <div id="current-letter-display">
                <div id="current-letter-label">CURRENT LETTER</div>
                <div id="current-letter-big">—</div>
            </div>
        </div>

        <!-- Middle section -->
        <div id="middle-section">
            <!-- Word display - horizontal with images below -->
            <div id="word-display">
                <div id="word-letters"></div>
                <div id="instruction">sign each letter to continue</div>
            </div>

            <!-- Curved camera -->
            <div id="camera-wrapper">
                <div id="canvas-container"></div>
            </div>
        </div>
    </div>

    <!-- Completion overlay -->
    <div id="complete-overlay">
        <div id="complete-content">
            <div id="complete-message">well done!</div>
            <div id="complete-submessage">returning to level selection...</div>
        </div>
    </div>

    <!-- Load p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

    <!-- Load ml5.js library -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
        // ==========================================
        // FADE IN IMMEDIATELY (BEFORE ANYTHING ELSE)
        // ==========================================
        document.body.classList.add('fade-in');

        // ==========================================
        // GLOBAL VARIABLES
        // ==========================================
        let video;
        let classifier;
        let handpose;
        let modelReady = false;
        let handposeReady = false;
        let predictions = [];
        let currentPrediction = '';
        let currentConfidence = 0;

        // Word spelling for different levels
        const levelWords = {
            '1': 'ABCDE',
            '2': 'LEARN',
            '3': 'COMMUNICATE'
        };

        // Get selected level from localStorage
        const selectedLevel = localStorage.getItem('aslLevel') || '1';
        const targetWord = levelWords[selectedLevel] || 'ABCDE';
        let currentLetterIndex = 0;

        // Add level-specific class to body for conditional styling
        document.body.classList.add(`level-${selectedLevel}`);

        // ==========================================
        // LEVEL MANAGEMENT
        // ==========================================
        // Update level indicator
        document.getElementById('level-indicator').textContent = `level ${selectedLevel}`;

        // Initialize word display
        const wordLettersDiv = document.getElementById('word-letters');
        targetWord.split('').forEach((letter, index) => {
            const container = document.createElement('div');
            container.className = 'letter-container';
            container.id = `container-${index}`;

            // Set initial state
            if (index === 0) {
                container.classList.add('current');
            } else {
                container.classList.add('upcoming');
            }

            // Create letter text
            const letterSpan = document.createElement('span');
            letterSpan.className = 'word-letter';
            letterSpan.textContent = letter;

            // Create image element with error handling
            const letterImage = document.createElement('img');
            letterImage.className = 'letter-image';
            letterImage.src = `${letter}.png`;
            letterImage.alt = `ASL sign for ${letter}`;

            // Handle missing images gracefully
            letterImage.onerror = function() {
                console.warn(`Image not found: ${letter}.png`);
                this.style.display = 'none';
            };

            container.appendChild(letterSpan);
            container.appendChild(letterImage);
            wordLettersDiv.appendChild(container);
        });

        // Update current letter display
        function updateCurrentLetter() {
            const currentLetter = targetWord[currentLetterIndex];
            document.getElementById('current-letter-big').textContent = currentLetter;
        }

        updateCurrentLetter();

        // Function to go back to level selection
        function goBack() {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'levels.html';
            }, 1200);
        }

        // Function to skip to next letter
        function skipLetter() {
            if (currentLetterIndex >= targetWord.length) return;

            // Mark current letter as completed
            const currentContainer = document.getElementById(`container-${currentLetterIndex}`);
            currentContainer.classList.remove('current');
            currentContainer.classList.add('completed');

            currentLetterIndex++;

            // Check if word is complete
            if (currentLetterIndex >= targetWord.length) {
                setTimeout(() => {
                    showCompletion();
                }, 800);
            } else {
                // Move to next letter
                const nextContainer = document.getElementById(`container-${currentLetterIndex}`);
                nextContainer.classList.remove('upcoming');
                nextContainer.classList.add('current');
                updateCurrentLetter();
            }
        }

        // Encouragement messages
        const encouragementMessages = [
            'amazing!',
            'great job!',
            'well done!',
            'fantastic!',
            'excellent!',
            'wonderful!',
            'brilliant!',
            'perfect!'
        ];

        // Function to show mascot encouragement
        function showEncouragement() {
            const mascotContainer = document.getElementById('mascot-container');
            const encouragementText = document.getElementById('encouragement-text');

            // Random encouragement message
            const randomMessage = encouragementMessages[Math.floor(Math.random() * encouragementMessages.length)];
            encouragementText.textContent = randomMessage;

            // Show mascot
            mascotContainer.classList.add('show');

            // Hide after 2 seconds
            setTimeout(() => {
                mascotContainer.classList.remove('show');
            }, 2000);
        }

        // Teachable Machine model URL
        const modelURL = 'https://teachablemachine.withgoogle.com/models/fHa4bsIGO/';

        // Confidence threshold (80%)
        const CONFIDENCE_THRESHOLD = 0.80;

        // ==========================================
        // P5.JS SETUP
        // ==========================================
        function setup() {
            // Create curved camera canvas
            let canvas = createCanvas(600, 450);
            canvas.parent('canvas-container');

            video = createCapture(VIDEO);
            video.hide();

            // Load the Handpose model
            handpose = ml5.handpose(video, handposeLoaded);
            handpose.on('predict', gotHands);

            // Load the Teachable Machine model
            try {
                classifier = ml5.imageClassifier(modelURL + 'model.json', video, modelLoaded);
            } catch (error) {
                console.error('Model loading error:', error);
            }
        }

        function handposeLoaded() {
            console.log('Handpose model loaded!');
            handposeReady = true;
        }

        function gotHands(results) {
            predictions = results;
        }

        function windowResized() {
            // Keep curved camera size consistent
            resizeCanvas(600, 450);
        }

        function modelLoaded() {
            console.log('ASL model loaded successfully!');
            modelReady = true;
            classifyVideo();
        }

        // ==========================================
        // CLASSIFY VIDEO FEED
        // ==========================================
        function classifyVideo() {
            classifier.classify(video, gotResult);
        }

        function gotResult(error, results) {
            if (error) {
                console.error('Classification error:', error);
                return;
            }

            if (results && results.length > 0) {
                const topPrediction = results[0];
                currentPrediction = topPrediction.label;
                currentConfidence = topPrediction.confidence;

                checkPrediction();
            }

            classifyVideo();
        }

        // ==========================================
        // CHECK PREDICTION
        // ==========================================
        function checkPrediction() {
            if (currentLetterIndex >= targetWord.length) return;

            const expectedLetter = targetWord[currentLetterIndex];

            if (currentConfidence >= CONFIDENCE_THRESHOLD && currentPrediction === expectedLetter) {
                // Mark current letter as completed
                const currentContainer = document.getElementById(`container-${currentLetterIndex}`);
                currentContainer.classList.remove('current');
                currentContainer.classList.add('completed');

                // Show encouragement mascot
                showEncouragement();

                currentLetterIndex++;

                // Check if word is complete
                if (currentLetterIndex >= targetWord.length) {
                    setTimeout(() => {
                        showCompletion();
                    }, 800);
                } else {
                    // Move to next letter
                    const nextContainer = document.getElementById(`container-${currentLetterIndex}`);
                    nextContainer.classList.remove('upcoming');
                    nextContainer.classList.add('current');
                    updateCurrentLetter();
                }
            }
        }

        // ==========================================
        // SHOW COMPLETION
        // ==========================================
        function showCompletion() {
            const overlay = document.getElementById('complete-overlay');
            overlay.classList.add('show');

            setTimeout(() => {
                window.location.href = 'levels.html';
            }, 3000);
        }

        // ==========================================
        // P5.JS DRAW
        // ==========================================
        function draw() {
            // Draw the mirrored webcam feed
            push();
            translate(width, 0);
            scale(-1, 1);
            image(video, 0, 0, width, height);
            pop();

            // Draw hand tracking
            if (handposeReady && predictions.length > 0) {
                drawHandSkeleton();
            }
        }

        // ==========================================
        // DRAW HAND SKELETON
        // ==========================================
        function drawHandSkeleton() {
            for (let i = 0; i < predictions.length; i++) {
                const hand = predictions[i];
                const landmarks = hand.landmarks;

                const scaleX = width / video.width;
                const scaleY = height / video.height;

                const scaledLandmarks = landmarks.map(point => [
                    width - (point[0] * scaleX),
                    point[1] * scaleY,
                    point[2]
                ]);

                drawConnections(scaledLandmarks);
                drawLandmarks(scaledLandmarks);
            }
        }

        function drawConnections(landmarks) {
            stroke(168, 154, 142, 120);
            strokeWeight(1.5);
            noFill();

            const connections = [
                [0, 1, 2, 3, 4],
                [0, 5, 6, 7, 8],
                [0, 9, 10, 11, 12],
                [0, 13, 14, 15, 16],
                [0, 17, 18, 19, 20],
                [5, 9, 13, 17]
            ];

            for (let path of connections) {
                beginShape();
                for (let index of path) {
                    const [x, y] = landmarks[index];
                    vertex(x, y);
                }
                endShape();
            }
        }

        function drawLandmarks(landmarks) {
            fill(168, 154, 142, 150);
            noStroke();

            for (let i = 0; i < landmarks.length; i++) {
                const [x, y] = landmarks[i];
                circle(x, y, 5);
            }
        }

        // ==========================================
        // CUSTOM CURSOR TRACKING
        // ==========================================
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');

        let mouseX = 0;
        let mouseY = 0;
        let circleX = 0;
        let circleY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        function animateCursor() {
            circleX += (mouseX - circleX) * 0.15;
            circleY += (mouseY - circleY) * 0.15;

            cursorCircle.style.left = circleX + 'px';
            cursorCircle.style.top = circleY + 'px';

            requestAnimationFrame(animateCursor);
        }

        animateCursor();
    </script>
</body>
</html>
