<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Alphabet Recognition</title>
    <style>
        /* ==========================================
           STYLING - Clean minimal dark theme
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            opacity: 0;
            transition: opacity 0.8s ease;
            cursor: none;
        }

        /* Fade in animation */
        body.fade-in {
            opacity: 1;
        }

        /* Fade out animation */
        body.fade-out {
            opacity: 0;
        }

        /* Left panel - Minimalist info display */
        #left-panel {
            width: 50%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            box-sizing: border-box;
        }

        /* Right panel - Camera feed */
        #right-panel {
            width: 50%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #left-panel h2 {
            font-size: 0.75em;
            margin: 0 0 80px 0;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
        }

        /* Back button */
        #back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            background: transparent;
            border: 1px solid #333;
            color: #666;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.7em;
            font-weight: 300;
            padding: 10px 20px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        #back-button:hover {
            border-color: #666;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Level indicator */
        #level-indicator {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 0.7em;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Hand detection indicator */
        #hand-indicator {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.6em;
            color: #333;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #hand-indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #222;
            transition: background-color 0.3s ease;
        }

        #hand-indicator.active #hand-indicator-dot {
            background-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #hand-indicator.active {
            color: #666;
        }

        #status {
            display: none;
            font-size: 0.65em;
            margin-top: 80px;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Prediction display area */
        #prediction-container {
            text-align: center;
        }

        #predicted-letter {
            font-size: 12em;
            font-weight: 200;
            margin-bottom: 30px;
            color: #ffffff;
            line-height: 1;
        }

        #confidence {
            font-size: 0.85em;
            color: #555;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Word spelling display for level 1 */
        #word-display {
            display: none;
            margin-top: 60px;
            text-align: center;
        }

        #word-display.active {
            display: block;
        }

        #word-letters {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .letter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .word-letter {
            font-size: 4em;
            font-weight: 200;
            letter-spacing: 2px;
            color: #333;
            transition: color 0.5s ease;
        }

        .word-letter.completed {
            color: #ffffff;
        }

        .letter-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            opacity: 0.3;
            transition: opacity 0.5s ease;
        }

        .letter-image.completed {
            opacity: 1;
        }

        #word-instruction {
            font-size: 0.7em;
            color: #555;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        /* Canvas container */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Instructions - hidden for minimal aesthetic */
        #instructions {
            display: none;
        }

        /* Congratulations overlay */
        #congrats-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #congrats-overlay.show {
            display: flex;
            opacity: 1;
        }

        #congrats-content {
            text-align: center;
        }

        #congrats-message {
            font-size: 3em;
            font-weight: 200;
            letter-spacing: 8px;
            color: #ffffff;
            margin-bottom: 30px;
            text-transform: lowercase;
        }

        #congrats-submessage {
            font-size: 1em;
            color: #666;
            letter-spacing: 3px;
            font-weight: 300;
        }

        /* Custom cursor */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-circle {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.2s ease;
            transform: translate(-50%, -50%);
        }

        #back-button:hover ~ .cursor-dot,
        button:hover ~ .cursor-dot {
            transform: translate(-50%, -50%) scale(1.5);
        }

        #back-button:hover ~ .cursor-circle,
        button:hover ~ .cursor-circle {
            transform: translate(-50%, -50%) scale(1.5);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Custom cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>

    <!-- Back button -->
    <button id="back-button" onclick="goBack()">← levels</button>

    <!-- Level indicator -->
    <div id="level-indicator">level —</div>

    <!-- Hand detection indicator -->
    <div id="hand-indicator">
        <div id="hand-indicator-dot"></div>
        <span>hand tracking</span>
    </div>

    <!-- Left panel - Minimalist display -->
    <div id="left-panel">
        <h2>Start your sign language learning</h2>

        <!-- Prediction display -->
        <div id="prediction-container">
            <div id="predicted-letter">—</div>
            <div id="confidence">—</div>
        </div>

        <!-- Word spelling display (level 1 only) -->
        <div id="word-display">
            <div id="word-letters"></div>
            <div id="word-instruction">spell the word</div>
        </div>

        <div id="status">initializing</div>
    </div>

    <!-- Right panel - Camera feed -->
    <div id="right-panel">
        <div id="canvas-container"></div>
    </div>

    <!-- Congratulations overlay -->
    <div id="congrats-overlay">
        <div id="congrats-content">
            <div id="congrats-message">congratulations!</div>
            <div id="congrats-submessage">returning to level selection...</div>
        </div>
    </div>

    <!-- Load p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

    <!-- Load ml5.js library for handpose tracking -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
        // ==========================================
        // GLOBAL VARIABLES (defined first)
        // ==========================================
        let video;
        let handpose;
        let modelReady = true; // API is always ready
        let handposeReady = false;
        let predictions = [];
        let currentPrediction = '';
        let currentConfidence = 0;
        let isClassifying = false; // Prevent overlapping API calls
        let handDetected = false; // Track if hand is currently visible
        let noHandFrameCount = 0; // Count frames without hand detection
        const NO_HAND_THRESHOLD = 3; // Show "no hand" message after 3 frames

        // Word spelling for level 1
        const targetWord = 'ABCDE';
        let currentLetterIndex = 0;
        let completedLetters = [];

        // HuggingFace API configuration
        const HF_API_URL = 'https://api-inference.huggingface.co/models/aalof/clipvision-asl-fingerspelling';
        const HF_API_TOKEN = ''; // Optional: Add your HF token for higher rate limits

        // Classification interval (ms) - faster with hand detection optimization
        const CLASSIFICATION_INTERVAL = 300; // Classify every 300ms when hand is detected

        // ==========================================
        // LEVEL MANAGEMENT
        // ==========================================
        // Get selected level from localStorage
        const selectedLevel = localStorage.getItem('aslLevel') || '1';

        // Update level indicator
        document.getElementById('level-indicator').textContent = `level ${selectedLevel}`;

        // Initialize word display for level 1
        if (selectedLevel === '1') {
            const wordDisplay = document.getElementById('word-display');
            wordDisplay.classList.add('active');

            // Create letter elements with images
            const wordLettersDiv = document.getElementById('word-letters');
            targetWord.split('').forEach((letter, index) => {
                // Create container for letter and image
                const container = document.createElement('div');
                container.className = 'letter-container';

                // Create letter text
                const letterSpan = document.createElement('span');
                letterSpan.className = 'word-letter';
                letterSpan.id = `letter-${index}`;
                letterSpan.textContent = letter;

                // Create image element
                const letterImage = document.createElement('img');
                letterImage.className = 'letter-image';
                letterImage.id = `image-${index}`;
                letterImage.src = `${letter}.png`;
                letterImage.alt = `ASL sign for ${letter}`;

                // Append letter and image to container
                container.appendChild(letterSpan);
                container.appendChild(letterImage);
                wordLettersDiv.appendChild(container);
            });
        }

        // Function to go back to level selection
        function goBack() {
            // Fade out before navigation
            document.body.classList.add('fade-out');

            // Navigate after fade
            setTimeout(() => {
                window.location.href = 'levels.html';
            }, 800);
        }

        // Fade in immediately when script runs
        document.body.classList.add('fade-in');

        // Confidence threshold (70% - CLIP model is highly accurate)
        const CONFIDENCE_THRESHOLD = 0.70;

        // ==========================================
        // P5.JS SETUP - Runs once at start
        // ==========================================
        function setup() {
            // Create canvas to fill the right half of the viewport
            let canvas = createCanvas(windowWidth / 2, windowHeight);
            canvas.parent('canvas-container');

            // Initialize webcam capture
            video = createCapture(VIDEO);
            video.hide(); // Hide default HTML video element
            video.size(640, 480); // Set standard resolution for API

            // Load the Handpose model for hand tracking (using ml5.js)
            loadHandpose();

            // Start classification loop after small delay for camera to initialize
            setTimeout(() => {
                document.getElementById('status').textContent = 'ready';
                document.getElementById('status').style.color = '#333';
                classifyVideoLoop();
            }, 1000);
        }

        // ==========================================
        // LOAD HANDPOSE MODEL
        // ==========================================
        function loadHandpose() {
            // Try to load handpose, but don't break if ml5.handpose isn't available
            if (typeof ml5 !== 'undefined' && ml5.handpose) {
                // Configure handpose with optimized settings for better sensitivity
                const options = {
                    maxContinuousChecks: 5,  // Check more frequently for hands
                    detectionConfidence: 0.7, // Lower threshold = more sensitive (default is 0.8)
                    maxNumHands: 1,           // Only track one hand for better performance
                    scoreThreshold: 0.6       // Lower threshold for landmark detection
                };

                handpose = ml5.handpose(video, options, handposeLoaded);
                handpose.on('predict', gotHands);
            } else {
                console.log('Handpose not available - skipping hand tracking visualization');
                handposeReady = false;
            }
        }

        // ==========================================
        // HANDPOSE LOADED CALLBACK
        // ==========================================
        function handposeLoaded() {
            console.log('Handpose model loaded!');
            handposeReady = true;
        }

        // ==========================================
        // HAND DETECTION CALLBACK
        // ==========================================
        function gotHands(results) {
            predictions = results;

            // Update hand indicator visual
            const handIndicator = document.getElementById('hand-indicator');

            // Track if hand is detected
            if (results && results.length > 0) {
                handDetected = true;
                noHandFrameCount = 0;
                if (handIndicator) {
                    handIndicator.classList.add('active');
                }
            } else {
                handDetected = false;
                noHandFrameCount++;
                if (handIndicator) {
                    handIndicator.classList.remove('active');
                }

                // Show "no hand" feedback after threshold
                if (noHandFrameCount > NO_HAND_THRESHOLD) {
                    currentPrediction = '';
                    currentConfidence = 0;
                    const letterElement = document.getElementById('predicted-letter');
                    const confidenceElement = document.getElementById('confidence');
                    letterElement.textContent = '—';
                    letterElement.style.color = '#222';
                    confidenceElement.textContent = 'show hand';
                    confidenceElement.style.color = '#333';
                }
            }
        }

        // ==========================================
        // WINDOW RESIZE - Adjust canvas when window resizes
        // ==========================================
        function windowResized() {
            resizeCanvas(windowWidth / 2, windowHeight);
        }

        // ==========================================
        // CLASSIFY VIDEO FEED CONTINUOUSLY WITH HF API
        // ==========================================
        function classifyVideoLoop() {
            // Call classification function repeatedly
            setInterval(async () => {
                // Only classify if:
                // 1. Not currently classifying
                // 2. Hand is detected (more efficient, saves API calls)
                // 3. OR handpose not loaded yet (fallback to continuous classification)
                if (!isClassifying && (handDetected || !handposeReady)) {
                    await classifyFrame();
                }
            }, CLASSIFICATION_INTERVAL);
        }

        // ==========================================
        // CAPTURE AND CLASSIFY CURRENT FRAME
        // ==========================================
        async function classifyFrame() {
            if (!video || !video.elt) {
                console.log('Video not ready');
                return;
            }

            isClassifying = true;
            console.log('Classifying frame... Hand detected:', handDetected);

            try {
                // Create a temporary canvas to capture the current frame
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 640;
                tempCanvas.height = 480;
                const ctx = tempCanvas.getContext('2d');

                // Draw current video frame to canvas
                ctx.drawImage(video.elt, 0, 0, 640, 480);

                // Convert canvas to blob
                const blob = await new Promise(resolve => {
                    tempCanvas.toBlob(resolve, 'image/jpeg', 0.95);
                });

                console.log('Sending to HuggingFace API...');
                // Call HuggingFace API
                const result = await queryHuggingFaceAPI(blob);

                if (result && result.length > 0) {
                    // Find the prediction with highest score
                    const topPrediction = result.reduce((max, curr) =>
                        curr.score > max.score ? curr : max
                    );

                    currentPrediction = topPrediction.label;
                    currentConfidence = topPrediction.score;

                    console.log('Prediction:', currentPrediction, 'Confidence:', currentConfidence);

                    // Update the display
                    updateDisplay();
                } else {
                    console.log('No valid result from API');
                }
            } catch (error) {
                console.error('Classification error:', error);
                // Don't show error to user unless it persists
            } finally {
                isClassifying = false;
            }
        }

        // ==========================================
        // QUERY HUGGINGFACE API
        // ==========================================
        async function queryHuggingFaceAPI(imageBlob) {
            const headers = {};

            // Add API token if provided
            if (HF_API_TOKEN) {
                headers['Authorization'] = `Bearer ${HF_API_TOKEN}`;
            }

            try {
                const response = await fetch(HF_API_URL, {
                    method: 'POST',
                    headers: headers,
                    body: imageBlob
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', response.status, errorText);

                    // Handle rate limiting
                    if (response.status === 429) {
                        console.log('Rate limited - waiting...');
                        document.getElementById('confidence').textContent = 'rate limited';
                    }

                    // Handle model loading (first request may take time)
                    if (response.status === 503) {
                        console.log('Model loading - please wait...');
                        document.getElementById('confidence').textContent = 'loading model...';
                    }

                    return null;
                }

                const result = await response.json();
                console.log('API Response:', result); // Debug logging
                return result;
            } catch (error) {
                console.error('Network error:', error);
                return null;
            }
        }

        // ==========================================
        // UPDATE PREDICTION DISPLAY
        // ==========================================
        function updateDisplay() {
            const letterElement = document.getElementById('predicted-letter');
            const confidenceElement = document.getElementById('confidence');

            // Check if confidence meets threshold
            if (currentConfidence >= CONFIDENCE_THRESHOLD) {
                // High confidence - show the predicted letter
                letterElement.textContent = currentPrediction;
                letterElement.style.color = '#ffffff';

                // Display confidence percentage
                const confidencePercent = (currentConfidence * 100).toFixed(0);
                confidenceElement.textContent = `${confidencePercent}%`;
                confidenceElement.style.color = '#555';

                // Level 1: Check if predicted letter matches next expected letter
                if (selectedLevel === '1' && currentLetterIndex < targetWord.length) {
                    const expectedLetter = targetWord[currentLetterIndex];

                    if (currentPrediction === expectedLetter) {
                        // Mark letter as completed
                        if (!completedLetters.includes(currentLetterIndex)) {
                            completedLetters.push(currentLetterIndex);
                            const letterSpan = document.getElementById(`letter-${currentLetterIndex}`);
                            const letterImage = document.getElementById(`image-${currentLetterIndex}`);
                            if (letterSpan) {
                                letterSpan.classList.add('completed');
                            }
                            if (letterImage) {
                                letterImage.classList.add('completed');
                            }
                            currentLetterIndex++;

                            // Check if word is complete
                            if (currentLetterIndex >= targetWord.length) {
                                setTimeout(() => {
                                    document.getElementById('word-instruction').textContent = 'complete!';
                                    document.getElementById('word-instruction').style.color = '#00ff00';

                                    // Show congratulations overlay
                                    showCongratulations();
                                }, 1400);
                            }
                        }
                    }
                }
            } else {
                // Low confidence - show minimal indicator
                letterElement.textContent = '—';
                letterElement.style.color = '#222';
                confidenceElement.textContent = '—';
                confidenceElement.style.color = '#222';
            }
        }

        // ==========================================
        // SHOW CONGRATULATIONS OVERLAY
        // ==========================================
        function showCongratulations() {
            const overlay = document.getElementById('congrats-overlay');

            // Show overlay with fade-in
            overlay.classList.add('show');

            // Wait 3 seconds, then redirect directly while overlay is still visible
            setTimeout(() => {
                // Navigate immediately with overlay still showing to prevent flash
                window.location.href = 'levels.html';
            }, 3000);
        }

        // ==========================================
        // P5.JS DRAW - Runs continuously
        // ==========================================
        function draw() {
            // Draw the webcam feed to fill the entire canvas (mirrored for natural interaction)
            push();
            translate(width, 0);
            scale(-1, 1); // Mirror the video horizontally
            image(video, 0, 0, width, height);
            pop();

            // Draw hand tracking if hands are detected
            if (handposeReady && predictions.length > 0) {
                drawHandSkeleton();
            }
        }

        // ==========================================
        // DRAW HAND SKELETON AND LANDMARKS
        // ==========================================
        function drawHandSkeleton() {
            // Loop through all detected hands
            for (let i = 0; i < predictions.length; i++) {
                const hand = predictions[i];
                const landmarks = hand.landmarks;

                // Calculate scale factors between video and canvas
                const scaleX = width / video.width;
                const scaleY = height / video.height;

                // Scale and mirror the landmarks for the stretched, flipped video
                const scaledLandmarks = landmarks.map(point => [
                    width - (point[0] * scaleX),  // Mirror X and scale
                    point[1] * scaleY,             // Scale Y
                    point[2]                       // Keep Z depth as-is
                ]);

                // Draw the skeleton connections first
                drawConnections(scaledLandmarks);

                // Draw the landmark points (joints)
                drawLandmarks(scaledLandmarks);
            }
        }

        // ==========================================
        // DRAW CONNECTIONS BETWEEN LANDMARKS
        // ==========================================
        function drawConnections(landmarks) {
            // Set style for skeleton lines - brighter and thicker for better visibility
            stroke(255, 255, 255, 200);
            strokeWeight(2.5);
            noFill();

            // Define the connections for the hand skeleton
            const connections = [
                // Thumb
                [0, 1, 2, 3, 4],
                // Index finger
                [0, 5, 6, 7, 8],
                // Middle finger
                [0, 9, 10, 11, 12],
                // Ring finger
                [0, 13, 14, 15, 16],
                // Pinky
                [0, 17, 18, 19, 20],
                // Palm base connections
                [5, 9, 13, 17]
            ];

            // Draw each connection path
            for (let path of connections) {
                beginShape();
                for (let index of path) {
                    const [x, y] = landmarks[index];
                    vertex(x, y);
                }
                endShape();
            }
        }

        // ==========================================
        // DRAW LANDMARK POINTS (JOINTS)
        // ==========================================
        function drawLandmarks(landmarks) {
            // Set style for landmark circles - brighter cyan with glow
            fill(0, 255, 255, 180);
            noStroke();

            // Draw a circle for each of the 21 landmarks
            for (let i = 0; i < landmarks.length; i++) {
                const [x, y] = landmarks[i];
                // Draw glow effect
                fill(0, 255, 255, 40);
                circle(x, y, 12);
                // Draw main point
                fill(0, 255, 255, 220);
                circle(x, y, 7);
            }
        }

        // ==========================================
        // CUSTOM CURSOR TRACKING
        // ==========================================
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');

        let mouseX = 0;
        let mouseY = 0;
        let circleX = 0;
        let circleY = 0;

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Update dot position immediately
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        // Smooth follow for circle
        function animateCursor() {
            // Lerp (linear interpolation) for smooth following
            circleX += (mouseX - circleX) * 0.15;
            circleY += (mouseY - circleY) * 0.15;

            cursorCircle.style.left = circleX + 'px';
            cursorCircle.style.top = circleY + 'px';

            requestAnimationFrame(animateCursor);
        }

        animateCursor();
    </script>
</body>
</html>
