<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Alphabet Recognition</title>
    <style>
        /* ==========================================
           STYLING - Clean minimal dark theme
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Fade in animation */
        body.fade-in {
            opacity: 1;
        }

        /* Fade out animation */
        body.fade-out {
            opacity: 0;
        }

        /* Left panel - Minimalist info display */
        #left-panel {
            width: 50%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            box-sizing: border-box;
        }

        /* Right panel - Camera feed */
        #right-panel {
            width: 50%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #left-panel h2 {
            font-size: 0.75em;
            margin: 0 0 80px 0;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
        }

        /* Back button */
        #back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            background: transparent;
            border: 1px solid #333;
            color: #666;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.7em;
            font-weight: 300;
            padding: 10px 20px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        #back-button:hover {
            border-color: #666;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Level indicator */
        #level-indicator {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 0.7em;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #status {
            font-size: 0.65em;
            margin-top: 80px;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Prediction display area */
        #prediction-container {
            text-align: center;
        }

        #predicted-letter {
            font-size: 12em;
            font-weight: 200;
            margin-bottom: 30px;
            color: #ffffff;
            line-height: 1;
        }

        #confidence {
            font-size: 0.85em;
            color: #555;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Word spelling display for level 1 */
        #word-display {
            display: none;
            margin-top: 60px;
            text-align: center;
        }

        #word-display.active {
            display: block;
        }

        #word-letters {
            font-size: 4em;
            font-weight: 200;
            letter-spacing: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .word-letter {
            color: #333;
            transition: color 0.5s ease;
        }

        .word-letter.completed {
            color: #ffffff;
        }

        #word-instruction {
            font-size: 0.7em;
            color: #555;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        /* Canvas container */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Instructions - hidden for minimal aesthetic */
        #instructions {
            display: none;
        }

        /* Congratulations overlay */
        #congrats-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #congrats-overlay.show {
            display: flex;
            opacity: 1;
        }

        #congrats-content {
            text-align: center;
        }

        #congrats-message {
            font-size: 3em;
            font-weight: 200;
            letter-spacing: 8px;
            color: #ffffff;
            margin-bottom: 30px;
            text-transform: lowercase;
        }

        #congrats-submessage {
            font-size: 1em;
            color: #666;
            letter-spacing: 3px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <!-- Back button -->
    <button id="back-button" onclick="goBack()">← levels</button>

    <!-- Level indicator -->
    <div id="level-indicator">level —</div>

    <!-- Left panel - Minimalist display -->
    <div id="left-panel">
        <h2>Start your sign language learning</h2>

        <!-- Prediction display -->
        <div id="prediction-container">
            <div id="predicted-letter">—</div>
            <div id="confidence">—</div>
        </div>

        <!-- Word spelling display (level 1 only) -->
        <div id="word-display">
            <div id="word-letters"></div>
            <div id="word-instruction">spell the word</div>
        </div>

        <div id="status">initializing</div>
    </div>

    <!-- Right panel - Camera feed -->
    <div id="right-panel">
        <div id="canvas-container"></div>
    </div>

    <!-- Congratulations overlay -->
    <div id="congrats-overlay">
        <div id="congrats-content">
            <div id="congrats-message">congratulations!</div>
            <div id="congrats-submessage">returning to level selection...</div>
        </div>
    </div>

    <!-- Load p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

    <!-- Load ml5.js library -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
        // ==========================================
        // GLOBAL VARIABLES (defined first)
        // ==========================================
        let video;
        let classifier;
        let handpose;
        let modelReady = false;
        let handposeReady = false;
        let predictions = [];
        let currentPrediction = '';
        let currentConfidence = 0;

        // Word spelling for level 1
        const targetWord = 'ABCDE';
        let currentLetterIndex = 0;
        let completedLetters = [];

        // ==========================================
        // LEVEL MANAGEMENT
        // ==========================================
        // Get selected level from localStorage
        const selectedLevel = localStorage.getItem('aslLevel') || '1';

        // Update level indicator
        document.getElementById('level-indicator').textContent = `level ${selectedLevel}`;

        // Initialize word display for level 1
        if (selectedLevel === '1') {
            const wordDisplay = document.getElementById('word-display');
            wordDisplay.classList.add('active');

            // Create letter elements
            const wordLettersDiv = document.getElementById('word-letters');
            targetWord.split('').forEach((letter, index) => {
                const letterSpan = document.createElement('span');
                letterSpan.className = 'word-letter';
                letterSpan.id = `letter-${index}`;
                letterSpan.textContent = letter;
                wordLettersDiv.appendChild(letterSpan);
            });
        }

        // Function to go back to level selection
        function goBack() {
            // Fade out before navigation
            document.body.classList.add('fade-out');

            // Navigate after fade
            setTimeout(() => {
                window.location.href = 'levels.html';
            }, 800);
        }

        // Fade in immediately when script runs
        document.body.classList.add('fade-in');

        // Teachable Machine model URL
        // IMPORTANT: Replace this URL with your own trained model from Teachable Machine
        // To create your own model:
        // 1. Go to https://teachablemachine.withgoogle.com/
        // 2. Choose "Image Project" → "Standard image model"
        // 3. Create classes for each ASL letter (A-Z)
        // 4. Upload or capture training images for each letter
        // 5. Train the model
        // 6. Export → "Upload my model" → Copy the shareable link
        // 7. Replace the URL below with your model URL

        const modelURL = 'https://teachablemachine.withgoogle.com/models/fPxh7xXbR/';

        // Confidence threshold (80%)
        const CONFIDENCE_THRESHOLD = 0.80;

        // ==========================================
        // P5.JS SETUP - Runs once at start
        // ==========================================
        function setup() {
            // Create canvas to fill the right half of the viewport
            let canvas = createCanvas(windowWidth / 2, windowHeight);
            canvas.parent('canvas-container');

            // Initialize webcam capture
            video = createCapture(VIDEO);
            video.hide(); // Hide default HTML video element

            // Load the Handpose model for hand tracking
            handpose = ml5.handpose(video, handposeLoaded);
            handpose.on('predict', gotHands);

            // Load the Teachable Machine image classification model
            try {
                classifier = ml5.imageClassifier(modelURL + 'model.json', video, modelLoaded, modelError);
            } catch (error) {
                modelError(error);
            }
        }

        // ==========================================
        // HANDPOSE LOADED CALLBACK
        // ==========================================
        function handposeLoaded() {
            console.log('Handpose model loaded!');
            handposeReady = true;
        }

        // ==========================================
        // HAND DETECTION CALLBACK
        // ==========================================
        function gotHands(results) {
            predictions = results;
        }

        // ==========================================
        // WINDOW RESIZE - Adjust canvas when window resizes
        // ==========================================
        function windowResized() {
            resizeCanvas(windowWidth / 2, windowHeight);
        }

        // ==========================================
        // MODEL LOADED CALLBACK
        // ==========================================
        function modelLoaded() {
            console.log('ASL model loaded successfully!');
            modelReady = true;
            document.getElementById('status').textContent = 'ready';
            document.getElementById('status').style.color = '#333';

            // Start classifying the video feed
            classifyVideo();
        }

        // ==========================================
        // MODEL ERROR CALLBACK
        // ==========================================
        function modelError(error) {
            console.error('Model loading error:', error);
            document.getElementById('status').textContent = 'model not found';
            document.getElementById('status').style.color = '#444';
            document.getElementById('confidence').textContent = 'configure model url';
            document.getElementById('confidence').style.color = '#444';
        }

        // ==========================================
        // CLASSIFY VIDEO FEED CONTINUOUSLY
        // ==========================================
        function classifyVideo() {
            // Classify the current video frame
            // The classifier will call gotResult with predictions
            classifier.classify(video, gotResult);
        }

        // ==========================================
        // HANDLE CLASSIFICATION RESULTS
        // ==========================================
        function gotResult(error, results) {
            // Handle any errors
            if (error) {
                console.error('Classification error:', error);
                return;
            }

            // results is an array of predictions sorted by confidence
            // results[0] is the most confident prediction
            if (results && results.length > 0) {
                const topPrediction = results[0];
                currentPrediction = topPrediction.label;
                currentConfidence = topPrediction.confidence;

                // Update the display with the new prediction
                updateDisplay();
            }

            // Continue classifying (recursive call for continuous predictions)
            classifyVideo();
        }

        // ==========================================
        // UPDATE PREDICTION DISPLAY
        // ==========================================
        function updateDisplay() {
            const letterElement = document.getElementById('predicted-letter');
            const confidenceElement = document.getElementById('confidence');

            // Check if confidence meets threshold
            if (currentConfidence >= CONFIDENCE_THRESHOLD) {
                // High confidence - show the predicted letter
                letterElement.textContent = currentPrediction;
                letterElement.style.color = '#ffffff';

                // Display confidence percentage
                const confidencePercent = (currentConfidence * 100).toFixed(0);
                confidenceElement.textContent = `${confidencePercent}%`;
                confidenceElement.style.color = '#555';

                // Level 1: Check if predicted letter matches next expected letter
                if (selectedLevel === '1' && currentLetterIndex < targetWord.length) {
                    const expectedLetter = targetWord[currentLetterIndex];

                    if (currentPrediction === expectedLetter) {
                        // Mark letter as completed
                        if (!completedLetters.includes(currentLetterIndex)) {
                            completedLetters.push(currentLetterIndex);
                            const letterSpan = document.getElementById(`letter-${currentLetterIndex}`);
                            if (letterSpan) {
                                letterSpan.classList.add('completed');
                            }
                            currentLetterIndex++;

                            // Check if word is complete
                            if (currentLetterIndex >= targetWord.length) {
                                setTimeout(() => {
                                    document.getElementById('word-instruction').textContent = 'complete!';
                                    document.getElementById('word-instruction').style.color = '#00ff00';

                                    // Show congratulations overlay
                                    showCongratulations();
                                }, 1400);
                            }
                        }
                    }
                }
            } else {
                // Low confidence - show minimal indicator
                letterElement.textContent = '—';
                letterElement.style.color = '#222';
                confidenceElement.textContent = '—';
                confidenceElement.style.color = '#222';
            }
        }

        // ==========================================
        // SHOW CONGRATULATIONS OVERLAY
        // ==========================================
        function showCongratulations() {
            const overlay = document.getElementById('congrats-overlay');

            // Show overlay with fade-in
            overlay.classList.add('show');

            // Wait 3 seconds, then redirect to levels page
            setTimeout(() => {
                // Fade out overlay
                overlay.style.opacity = '0';

                // Navigate after fade
                setTimeout(() => {
                    window.location.href = 'levels.html';
                }, 800);
            }, 3000);
        }

        // ==========================================
        // P5.JS DRAW - Runs continuously
        // ==========================================
        function draw() {
            // Draw the webcam feed to fill the entire canvas (mirrored for natural interaction)
            push();
            translate(width, 0);
            scale(-1, 1); // Mirror the video horizontally
            image(video, 0, 0, width, height);
            pop();

            // Draw hand tracking if hands are detected
            if (handposeReady && predictions.length > 0) {
                drawHandSkeleton();
            }
        }

        // ==========================================
        // DRAW HAND SKELETON AND LANDMARKS
        // ==========================================
        function drawHandSkeleton() {
            // Loop through all detected hands
            for (let i = 0; i < predictions.length; i++) {
                const hand = predictions[i];
                const landmarks = hand.landmarks;

                // Calculate scale factors between video and canvas
                const scaleX = width / video.width;
                const scaleY = height / video.height;

                // Scale and mirror the landmarks for the stretched, flipped video
                const scaledLandmarks = landmarks.map(point => [
                    width - (point[0] * scaleX),  // Mirror X and scale
                    point[1] * scaleY,             // Scale Y
                    point[2]                       // Keep Z depth as-is
                ]);

                // Draw the skeleton connections first
                drawConnections(scaledLandmarks);

                // Draw the landmark points (joints)
                drawLandmarks(scaledLandmarks);
            }
        }

        // ==========================================
        // DRAW CONNECTIONS BETWEEN LANDMARKS
        // ==========================================
        function drawConnections(landmarks) {
            // Set style for skeleton lines - minimalist white lines
            stroke(255, 255, 255, 150);
            strokeWeight(1.5);
            noFill();

            // Define the connections for the hand skeleton
            const connections = [
                // Thumb
                [0, 1, 2, 3, 4],
                // Index finger
                [0, 5, 6, 7, 8],
                // Middle finger
                [0, 9, 10, 11, 12],
                // Ring finger
                [0, 13, 14, 15, 16],
                // Pinky
                [0, 17, 18, 19, 20],
                // Palm base connections
                [5, 9, 13, 17]
            ];

            // Draw each connection path
            for (let path of connections) {
                beginShape();
                for (let index of path) {
                    const [x, y] = landmarks[index];
                    vertex(x, y);
                }
                endShape();
            }
        }

        // ==========================================
        // DRAW LANDMARK POINTS (JOINTS)
        // ==========================================
        function drawLandmarks(landmarks) {
            // Set style for landmark circles - subtle cyan
            fill(0, 255, 255, 120);
            noStroke();

            // Draw a circle for each of the 21 landmarks
            for (let i = 0; i < landmarks.length; i++) {
                const [x, y] = landmarks[i];
                circle(x, y, 6);
            }
        }
    </script>
</body>
</html>
