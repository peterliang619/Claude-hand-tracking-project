<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Alphabet Recognition</title>
    <style>
        /* ==========================================
           STYLING - Clean minimal dark theme
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Left panel - Minimalist info display */
        #left-panel {
            width: 50%;
            height: 100vh;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Right panel - Camera feed */
        #right-panel {
            width: 50%;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 60px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        #status {
            font-size: 1em;
            margin-bottom: 40px;
            color: #888;
        }

        /* Prediction display area */
        #prediction-container {
            text-align: center;
            margin-bottom: 40px;
        }

        #predicted-letter {
            font-size: 10em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            line-height: 1;
        }

        #confidence {
            font-size: 1.3em;
            color: #aaa;
            font-weight: 300;
        }

        /* Canvas container */
        #canvas-container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* Instructions */
        #instructions {
            margin-top: 40px;
            text-align: center;
            color: #666;
            font-size: 0.8em;
            max-width: 500px;
            line-height: 1.6;
        }

        .model-note {
            display: none; /* Hide detailed instructions for minimal look */
        }

        .model-note strong {
            color: #00ffff;
        }
    </style>
</head>
<body>
    <!-- Left panel - Minimalist display -->
    <div id="left-panel">
        <h1>ASL Recognition</h1>

        <!-- Prediction display -->
        <div id="prediction-container">
            <div id="predicted-letter">—</div>
            <div id="confidence">Waiting for sign...</div>
        </div>

        <div id="status">Loading model...</div>

        <!-- Minimal instructions -->
        <div id="instructions">
            <p>Show an ASL sign to the camera</p>
        </div>
    </div>

    <!-- Right panel - Camera feed -->
    <div id="right-panel">
        <div id="canvas-container"></div>
    </div>

    <!-- Load p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

    <!-- Load ml5.js library -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
        // ==========================================
        // GLOBAL VARIABLES
        // ==========================================
        let video;
        let classifier;
        let modelReady = false;
        let currentPrediction = '';
        let currentConfidence = 0;

        // Teachable Machine model URL
        // IMPORTANT: Replace this URL with your own trained model from Teachable Machine
        // To create your own model:
        // 1. Go to https://teachablemachine.withgoogle.com/
        // 2. Choose "Image Project" → "Standard image model"
        // 3. Create classes for each ASL letter (A-Z)
        // 4. Upload or capture training images for each letter
        // 5. Train the model
        // 6. Export → "Upload my model" → Copy the shareable link
        // 7. Replace the URL below with your model URL

        const modelURL = 'https://teachablemachine.withgoogle.com/models/Md1wVGcGO/';

        // Confidence threshold (80%)
        const CONFIDENCE_THRESHOLD = 0.80;

        // ==========================================
        // P5.JS SETUP - Runs once at start
        // ==========================================
        function setup() {
            // Create canvas to fill the right half of the screen
            let canvas = createCanvas(windowWidth / 2, windowHeight);
            canvas.parent('canvas-container');

            // Initialize webcam capture
            video = createCapture(VIDEO);
            video.size(width, height);
            video.hide(); // Hide default HTML video element

            // Load the Teachable Machine image classification model
            // The model consists of model.json and weights files
            // Added error handling for model loading
            try {
                classifier = ml5.imageClassifier(modelURL + 'model.json', video, modelLoaded, modelError);
            } catch (error) {
                modelError(error);
            }
        }

        // ==========================================
        // WINDOW RESIZE - Adjust canvas when window resizes
        // ==========================================
        function windowResized() {
            resizeCanvas(windowWidth / 2, windowHeight);
            video.size(width, height);
        }

        // ==========================================
        // MODEL LOADED CALLBACK
        // ==========================================
        function modelLoaded() {
            console.log('ASL model loaded successfully!');
            modelReady = true;
            document.getElementById('status').textContent = 'Model ready! Show an ASL sign.';
            document.getElementById('status').style.color = '#00ff00';

            // Start classifying the video feed
            classifyVideo();
        }

        // ==========================================
        // MODEL ERROR CALLBACK
        // ==========================================
        function modelError(error) {
            console.error('Model loading error:', error);
            document.getElementById('status').textContent = '⚠️ Model failed to load. Please train your own model.';
            document.getElementById('status').style.color = '#ff6666';
            document.getElementById('confidence').textContent = 'See instructions below to create your model';
            document.getElementById('confidence').style.color = '#ff6666';
        }

        // ==========================================
        // CLASSIFY VIDEO FEED CONTINUOUSLY
        // ==========================================
        function classifyVideo() {
            // Classify the current video frame
            // The classifier will call gotResult with predictions
            classifier.classify(video, gotResult);
        }

        // ==========================================
        // HANDLE CLASSIFICATION RESULTS
        // ==========================================
        function gotResult(error, results) {
            // Handle any errors
            if (error) {
                console.error('Classification error:', error);
                return;
            }

            // results is an array of predictions sorted by confidence
            // results[0] is the most confident prediction
            if (results && results.length > 0) {
                const topPrediction = results[0];
                currentPrediction = topPrediction.label;
                currentConfidence = topPrediction.confidence;

                // Update the display with the new prediction
                updateDisplay();
            }

            // Continue classifying (recursive call for continuous predictions)
            classifyVideo();
        }

        // ==========================================
        // UPDATE PREDICTION DISPLAY
        // ==========================================
        function updateDisplay() {
            const letterElement = document.getElementById('predicted-letter');
            const confidenceElement = document.getElementById('confidence');

            // Check if confidence meets threshold
            if (currentConfidence >= CONFIDENCE_THRESHOLD) {
                // High confidence - show the predicted letter
                letterElement.textContent = currentPrediction;
                letterElement.style.color = '#00ffff';

                // Display confidence percentage
                const confidencePercent = (currentConfidence * 100).toFixed(0);
                confidenceElement.textContent = `${currentPrediction} — ${confidencePercent}%`;
                confidenceElement.style.color = '#aaa';
            } else {
                // Low confidence - show unclear message
                letterElement.textContent = '...';
                letterElement.style.color = '#666';
                confidenceElement.textContent = 'Unclear sign';
                confidenceElement.style.color = '#666';
            }
        }

        // ==========================================
        // P5.JS DRAW - Runs continuously
        // ==========================================
        function draw() {
            // Draw the webcam feed to fill the entire canvas (mirrored for natural interaction)
            push();
            translate(width, 0);
            scale(-1, 1); // Mirror the video horizontally
            image(video, 0, 0, width, height);
            pop();
        }
    </script>
</body>
</html>
