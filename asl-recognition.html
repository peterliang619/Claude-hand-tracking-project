<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Alphabet Recognition</title>
    <style>
        /* ==========================================
           STYLING - Clean minimal dark theme
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Left panel - Minimalist info display */
        #left-panel {
            width: 50%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            box-sizing: border-box;
        }

        /* Right panel - Camera feed */
        #right-panel {
            width: 50%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #left-panel h2 {
            font-size: 0.75em;
            margin: 0 0 80px 0;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
        }

        /* Back button */
        #back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            background: transparent;
            border: 1px solid #333;
            color: #666;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.7em;
            font-weight: 300;
            padding: 10px 20px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        #back-button:hover {
            border-color: #666;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Level indicator */
        #level-indicator {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 0.7em;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #status {
            font-size: 0.65em;
            margin-top: 80px;
            color: #444;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Prediction display area */
        #prediction-container {
            text-align: center;
        }

        #predicted-letter {
            font-size: 12em;
            font-weight: 200;
            margin-bottom: 30px;
            color: #ffffff;
            line-height: 1;
        }

        #confidence {
            font-size: 0.85em;
            color: #555;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Canvas container */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Instructions - hidden for minimal aesthetic */
        #instructions {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Back button -->
    <button id="back-button" onclick="goBack()">← levels</button>

    <!-- Level indicator -->
    <div id="level-indicator">level —</div>

    <!-- Left panel - Minimalist display -->
    <div id="left-panel">
        <h2>ASL RECOGNITION</h2>

        <!-- Prediction display -->
        <div id="prediction-container">
            <div id="predicted-letter">—</div>
            <div id="confidence">—</div>
        </div>

        <div id="status">initializing</div>
    </div>

    <!-- Right panel - Camera feed -->
    <div id="right-panel">
        <div id="canvas-container"></div>
    </div>

    <!-- Load p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

    <!-- Load ml5.js library -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
        // ==========================================
        // LEVEL MANAGEMENT
        // ==========================================
        // Get selected level from localStorage
        const selectedLevel = localStorage.getItem('aslLevel') || '1';

        // Update level indicator
        document.getElementById('level-indicator').textContent = `level ${selectedLevel}`;

        // Function to go back to level selection
        function goBack() {
            window.location.href = 'index.html';
        }

        // ==========================================
        // GLOBAL VARIABLES
        // ==========================================
        let video;
        let classifier;
        let modelReady = false;
        let currentPrediction = '';
        let currentConfidence = 0;

        // Teachable Machine model URL
        // IMPORTANT: Replace this URL with your own trained model from Teachable Machine
        // To create your own model:
        // 1. Go to https://teachablemachine.withgoogle.com/
        // 2. Choose "Image Project" → "Standard image model"
        // 3. Create classes for each ASL letter (A-Z)
        // 4. Upload or capture training images for each letter
        // 5. Train the model
        // 6. Export → "Upload my model" → Copy the shareable link
        // 7. Replace the URL below with your model URL

        const modelURL = 'https://teachablemachine.withgoogle.com/models/Md1wVGcGO/';

        // Confidence threshold (80%)
        const CONFIDENCE_THRESHOLD = 0.80;

        // ==========================================
        // P5.JS SETUP - Runs once at start
        // ==========================================
        function setup() {
            // Create canvas to fill the right half of the viewport
            let canvas = createCanvas(windowWidth / 2, windowHeight);
            canvas.parent('canvas-container');

            // Initialize webcam capture
            video = createCapture(VIDEO);
            video.size(width, height);
            video.hide(); // Hide default HTML video element

            // Load the Teachable Machine image classification model
            try {
                classifier = ml5.imageClassifier(modelURL + 'model.json', video, modelLoaded, modelError);
            } catch (error) {
                modelError(error);
            }
        }

        // ==========================================
        // WINDOW RESIZE - Adjust canvas when window resizes
        // ==========================================
        function windowResized() {
            resizeCanvas(windowWidth / 2, windowHeight);
            video.size(width, height);
        }

        // ==========================================
        // MODEL LOADED CALLBACK
        // ==========================================
        function modelLoaded() {
            console.log('ASL model loaded successfully!');
            modelReady = true;
            document.getElementById('status').textContent = 'ready';
            document.getElementById('status').style.color = '#333';

            // Start classifying the video feed
            classifyVideo();
        }

        // ==========================================
        // MODEL ERROR CALLBACK
        // ==========================================
        function modelError(error) {
            console.error('Model loading error:', error);
            document.getElementById('status').textContent = 'model not found';
            document.getElementById('status').style.color = '#444';
            document.getElementById('confidence').textContent = 'configure model url';
            document.getElementById('confidence').style.color = '#444';
        }

        // ==========================================
        // CLASSIFY VIDEO FEED CONTINUOUSLY
        // ==========================================
        function classifyVideo() {
            // Classify the current video frame
            // The classifier will call gotResult with predictions
            classifier.classify(video, gotResult);
        }

        // ==========================================
        // HANDLE CLASSIFICATION RESULTS
        // ==========================================
        function gotResult(error, results) {
            // Handle any errors
            if (error) {
                console.error('Classification error:', error);
                return;
            }

            // results is an array of predictions sorted by confidence
            // results[0] is the most confident prediction
            if (results && results.length > 0) {
                const topPrediction = results[0];
                currentPrediction = topPrediction.label;
                currentConfidence = topPrediction.confidence;

                // Update the display with the new prediction
                updateDisplay();
            }

            // Continue classifying (recursive call for continuous predictions)
            classifyVideo();
        }

        // ==========================================
        // UPDATE PREDICTION DISPLAY
        // ==========================================
        function updateDisplay() {
            const letterElement = document.getElementById('predicted-letter');
            const confidenceElement = document.getElementById('confidence');

            // Check if confidence meets threshold
            if (currentConfidence >= CONFIDENCE_THRESHOLD) {
                // High confidence - show the predicted letter
                letterElement.textContent = currentPrediction;
                letterElement.style.color = '#ffffff';

                // Display confidence percentage
                const confidencePercent = (currentConfidence * 100).toFixed(0);
                confidenceElement.textContent = `${confidencePercent}%`;
                confidenceElement.style.color = '#555';
            } else {
                // Low confidence - show minimal indicator
                letterElement.textContent = '—';
                letterElement.style.color = '#222';
                confidenceElement.textContent = '—';
                confidenceElement.style.color = '#222';
            }
        }

        // ==========================================
        // P5.JS DRAW - Runs continuously
        // ==========================================
        function draw() {
            // Draw the webcam feed to fill the entire canvas (mirrored for natural interaction)
            push();
            translate(width, 0);
            scale(-1, 1); // Mirror the video horizontally
            image(video, 0, 0, width, height);
            pop();
        }
    </script>
</body>
</html>
